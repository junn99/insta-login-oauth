<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CelebLife Static Canary</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #ffffff;
        color: #181225;
        display: flex;
        min-height: 100vh;
        margin: 0;
        justify-content: center;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
      }

      h1 {
        font-size: 1.25rem;
        line-height: 1.4;
        margin: 0 0 0.5rem;
      }

      p {
        color: #5f576d;
        font-size: 0.9375rem;
        line-height: 1.7;
        margin: 0;
      }
    </style>
  </head>
  <body data-celeblife-static-canary="login-static">
    <main>
      <h1>CelebLife static login canary</h1>
      <p>
        This hidden route verifies that Vercel can serve the login shell as a
        static asset before any Python or Streamlit runtime is loaded.
      </p>
    </main>
  </body>
</html>
